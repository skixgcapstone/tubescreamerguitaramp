name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg python3-tk
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check deployment scripts
        run: sh -n deploy/run-pi.sh deploy/test-codec-zero.sh
